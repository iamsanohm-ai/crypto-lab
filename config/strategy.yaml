# กลยุทธ์ทั้งหมดสลับได้จากไฟล์นี้ไฟล์เดียว (Engineer/Judge แก้ได้เฉพาะเมื่อคุณอนุมัติ)
mode: paper            # paper | live  — live ต้องได้ "go live" จากคุณ + อนุมัติทุกเทรด
exchange: binance
capital: 500           # USDT ต่อบัญชีจำลอง (แต่ละกลยุทธ์มีบัญชีของตัวเอง)
risk_per_trade: 0.005  # 0.5%
max_positions: 5
max_position_frac: 0.25
min_notional: 5
fee: 0.001
slippage: 0.0005
universe_top_n: 20
timeframe: 4h
sentinel:
  daily_loss_limit: 0.03       # -3% ต่อวัน → หยุด
  max_consecutive_losses: 3    # แพ้ติด 3 → หยุด
  stale_feed_minutes: 30       # แท่ง 4h ล่าสุดเก่ากว่า 4h30m → หยุด
  max_price_deviation: 0.05    # ราคาตอนส่งออเดอร์ห่างจากราคาปิดแท่งสัญญาณ >5% → ปฏิเสธ
  paper_auto_resume: true      # paper: หยุดแล้วพักถึงวันถัดไป (เจ้าของเลือก 2026-11-22); live: หยุดจนเจ้าของปลดเสมอ
strategies:
  - {role: champion,     name: keltner_trend,           params: {k: 2.0, stop: 3.0}, crowned: "2026-11-22",
     exit: {breakeven_r: 1.0}}   # กำไรถึง 1R (ราคาปิด 4h) → เลื่อน stop มาที่ทุน+ค่าธรรมเนียม · เจ้าของอนุมัติ 2026-11-25 (research/exit_research.json)
  - {role: challenger_1, name: golden_cross_50_200,     params: {fast: 30, slow: 120}}
  - {role: challenger_2, name: breakout_funding_filter, params: {n: 60, fmax: 0.0001}}   # funding live = ESTIMATE
  - {role: challenger_3, name: keltner_bold,            params: {k: 2.0, stop: 3.0, rs: 0.2}, exit: {breakeven_r: 1.0}}   # "บอทกล้า" — เจ้าของขอ 2026-11-25 · paper เท่านั้น · ทดสอบย้อนหลังแย่กว่า champion (+34.5% vs +38.3%)
grok:                       # Grok (xAI) เป็นผู้ตรวจสอบสัญญาณซื้อ: allow/veto เท่านั้น
  enabled: false             # เปิดเมื่อใส่ XAI_API_KEY ใน GitHub Secrets แล้ว
  mode: shadow               # shadow = บันทึกความเห็นอย่างเดียว | veto = ข้ามการซื้อเมื่อ Grok คัดค้าน (เจ้าของต้องอนุมัติก่อนเปลี่ยน)
  model: grok-4.7            # ชื่อรุ่นของ xAI — เปลี่ยนให้ตรงกับรุ่นที่บัญชีคุณใช้ได้
  min_veto_confidence: 0.6
  max_calls_per_day: 20      # เพดานจำนวนครั้งต่อวัน คุมค่าใช้จ่าย
