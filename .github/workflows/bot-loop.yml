# บอทแบบวนรอบ: รันต่อเนื่อง ~5 ชม. 50 นาที ติ๊กทุก 15 นาที (นาทีที่ 7/22/37/52) แล้วสั่งรันตัวเองต่อ
# ทำงานเฉพาะเมื่อ repo เป็น public (นาที Actions ฟรีไม่จำกัด) — ถ้า private จะข้ามเพื่อไม่ให้เปลืองโควตา
name: bot-loop
on:
  schedule:
    - cron: "50 */6 * * *"   # สำรอง: ปลุกให้ loop เริ่มใหม่ถ้าหลุด
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: bot-loop
  cancel-in-progress: false
jobs:
  loop:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - name: Hourly ticks
        run: |
          git config user.name "crypto-lab-bot"
          git config user.email "crypto-lab-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 340*60 ))
          # เทรดเร็ว (paper) วิ่งเบื้องหลังตลอดรอบ: เช็คราคาทุก 15 วินาที เก็บไฟล์ไว้นอก repo แล้ว sync ทุก 5 นาที
          SC="$RUNNER_TEMP/scalp"; mkdir -p "$SC"; cp state/scalper.json "$SC/" 2>/dev/null || true
          nohup python -m lab.scalper --dir "$SC" --minutes 342 > "$SC/log.txt" 2>&1 &
          sync_scalp() { [ -f "$SC/scalper.json" ] && cp "$SC/scalper.json" state/scalper.json && cp "$SC/scalper.json" docs/scalper.json; }
          while [ "$(date +%s)" -lt "$END" ]; do
            git fetch -q origin main && git reset -q --hard origin/main
            sync_scalp
            python -m lab.live || echo "tick failed"
            python -m lab.scanner || echo "scanner failed"
            python -m lab.carry || echo "carry failed"
            if ! python -m lab.dashboard; then
              echo "dashboard failed"; NOWA=$(date +%s)
              if [ $(( NOWA - ${LAST_ALERT:-0} )) -gt 3600 ]; then python -m lab.watchdog alert "สร้างหน้าเว็บไม่สำเร็จในรอบบอท — หน้าเว็บจะแสดงข้อมูลเก่า"; LAST_ALERT=$NOWA; fi
            fi
            git add state ledger dashboard/data.json docs/data.json docs/heartbeat.json docs/scalper.json docs/carry_paper.json
            if ! git diff --cached --quiet; then
              git commit -qm "paper tick $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase origin main && git push -q origin main || { git rebase --abort 2>/dev/null; echo "push skipped (conflict) — next tick retries"; }
            fi
            NOW=$(date +%s); NEXT=$(( ((NOW - 420)/900 + 1)*900 + 420 ))   # ทุก 15 นาที ที่นาที 7/22/37/52
            [ "$NEXT" -ge "$END" ] && break
            while [ "$(date +%s)" -lt "$NEXT" ]; do   # ระหว่างรอติ๊กถัดไป: ส่งผลเทรดเร็วขึ้นหน้าเว็บทุก 5 นาที
              W=$(( NEXT - $(date +%s) )); [ "$W" -gt 300 ] && W=300; [ "$W" -gt 0 ] && sleep "$W"
              [ "$(date +%s)" -ge "$NEXT" ] && break
              git fetch -q origin main && git reset -q --hard origin/main && sync_scalp
              git add state/scalper.json docs/scalper.json
              if ! git diff --cached --quiet; then git commit -qm "scalp sync $(date -u +%H:%MZ)"; git push -q origin main || echo "scalp push skipped"; fi
            done
          done
          # ส่งผลเทรดเร็วรอบสุดท้ายก่อนเริ่มรอบใหม่ (รอบใหม่จะอ่านต่อจากไฟล์นี้)
          pkill -f lab.scalper || true; sleep 2
          git fetch -q origin main && git reset -q --hard origin/main && sync_scalp
          git add state/scalper.json docs/scalper.json
          git diff --cached --quiet || { git commit -qm "scalp final sync"; git push -q origin main || true; }
      - name: Restart loop
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run bot-loop.yml --ref main
