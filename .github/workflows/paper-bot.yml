# บอท paper trading + Sentinel ทุกชั่วโมง — รันบน GitHub Actions (ฟรี, ไม่ใช้ AI)
name: paper-bot
on:
  schedule:
    - cron: "7 * * * *"      # ทุกชั่วโมงนาทีที่ 7 (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Paper tick (Sentinel checks inside)
        run: python -m lab.live
      - name: Dashboard snapshot
        run: python -m lab.dashboard
      - name: Commit state
        run: |
          git config user.name "crypto-lab-bot"
          git config user.email "crypto-lab-bot@users.noreply.github.com"
          git add state ledger dashboard/data.json docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "paper tick $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
